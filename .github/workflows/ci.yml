name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listing a bare `push:` here as
  # well ran the whole job twice for every commit on a branch with an open PR.
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (incl. calibration gate V1)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build
